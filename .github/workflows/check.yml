name: Check release source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run syntax and engineering checks
        run: node scripts/check.mjs
      - name: Run synthetic evaluation
        run: node scripts/evaluate.mjs
        env:
          STEPTRACE_TESTED_REVISION: ${{ github.sha }}
      - name: Build portable static release
        run: node scripts/build-release.mjs
